name: Gemini PR Code Review

on:
  # Auto-review on every new PR and each push to an existing PR
  pull_request:
    types: [opened, synchronize, reopened]

  # Manual trigger via PR comment: "/gemini review"
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ── Triggered by PR events ──────────────────────────────────────────────────
  review-on-pr:
    name: Auto Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:       ${{ github.event.pull_request.number }}
          REPO_FULL_NAME:  ${{ github.repository }}
          BASE_SHA:        ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:        ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/gemini_review.py

  # ── Triggered by "/gemini review" comment ──────────────────────────────────
  review-on-command:
    name: Manual Review (comment command)
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/gemini review')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the PR head, not the default branch
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Get PR metadata
        id: pr-meta
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('head_sha', pr.data.head.sha);

      - name: Post "thinking" reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              comment_id: context.payload.comment.id,
              content:    'eyes',
            });

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:       ${{ github.event.issue.number }}
          REPO_FULL_NAME:  ${{ github.repository }}
          BASE_SHA:        ${{ steps.pr-meta.outputs.base_sha }}
          HEAD_SHA:        ${{ steps.pr-meta.outputs.head_sha }}
        run: python .github/scripts/gemini_review.py
