name: Auto Close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-close-pr:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Post Explanation Comment and Close PR
        uses: actions/github-script@v7
        with:
          script: |
            const message = `Thank you for your interest in WindRPC.

            WindRPC currently has limited maintainer availability. As stated in our documentation, we are unable to accept external Pull Requests at this time.

            This Pull Request has been automatically closed. Thank you for your understanding.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
