platform_version_code: 1

types:
  enums:
    - { name: StatusCode, prefix: STATUS_CODE_, members: [
            # 0 ~ 17 (gRPC Status: https://grpc.github.io/grpc/core/md_doc_statuscodes.html)
            # { value: 0, name: OK },
            { value: 0, name: NONE },
            { value: 1, name: CANCELLED },
            { value: 2, name: UNKNOWN },
            { value: 3, name: INVALID_ARGUMENT },
            { value: 4, name: DEADLINE_EXCEEDED },
            { value: 5, name: NOT_FOUND },
            { value: 6, name: ALREADY_EXISTS },
            { value: 7, name: PERMISSION_DENIED },
            { value: 8, name: RESOURCE_EXHAUSTED },
            { value: 9, name: FAILED_PRECONDITION },
            { value: 10, name: ABORTED },
            { value: 11, name: OUT_OF_RANGE },
            { value: 12, name: UNIMPLEMENTED },
            { value: 13, name: INTERNAL },
            { value: 14, name: UNAVAILABLE },
            { value: 15, name: DATA_LOSS },
            { value: 16, name: UNAUTHENTICATED },
            # serialize/deserialize error
            { value: 17, name: INVALID_DATA_FORMAT }, # decoding failed
            { value: 18, name: MISSING_REQUIRED_FIELD },
            { value: 19, name: VERSION_MISMATCH },
          ] }
  messages:
    - name: Empty # if camel case or lower case or snake case, will be converted to pascal case
      description: 'No message(parameters/return value, void like in C/C++)'
      fields: []
    - name: Subscribe
      description: 'Message used for subscribing or unsubscribing async notifications'
      fields:
        - number: 1
          name: enable
          type: bool
          description: 'true: subscribe, false: unsubscribe'
        - number: 2
          name: data
          type: bytes
          property: optional
          description: 'user command or data'
          nanopb: { max_length: 32 }
    - name: Status
      description: 'System error status response message'
      fields:
        - number: 1
          name: code
          type: int32
        - number: 2
          name: message
          type: string
          property: optional
          nanopb: { max_length: 64 }
        - number: 3
          name: details
          type: bytes
          property: optional
          nanopb: { max_length: 64 }

## ---------------------------------------------------------------------------
## Core Services

services:
  - id: 6
    name: common
    messages:
      - name: PingResponse
        description: 'Ping handshake response message containing framework & spec version information'
        fields:
          - { number: 1, name: core_version_code, type: uint32 }
          - { number: 2, name: core_version_name, type: string, nanopb: { max_length: 32 } }
          - { number: 3, name: spec_version_code, type: uint32 }
          - { number: 4, name: spec_version_name, type: string, nanopb: { max_length: 32 } }
      - name: DeviceInfo
        description: 'Device Information Service (DIS) metadata message'
        fields:
          - { number: 1, name: manufacturer_name, type: string, nanopb: { max_length: 64 } }
          - { number: 2, name: model_number,       type: string, nanopb: { max_length: 64 } }
          - { number: 3, name: serial_number,      type: string, nanopb: { max_length: 64 } }
          - { number: 4, name: hw_revision,        type: string, nanopb: { max_length: 32 } }
          - { number: 5, name: fw_revision,        type: string, nanopb: { max_length: 32 } }
    rpcs:
      - id: 1
        name: ping
        type: REQUEST_RESPONSE
        command: types.Empty
        result: PingResponse
      - id: 2
        name: get_device_info
        type: REQUEST_RESPONSE
        command: types.Empty
        result: DeviceInfo
