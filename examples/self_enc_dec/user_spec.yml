package: bitnari

config:
  request_id: # actually type is bytes (type fixed)
    enable: false # true: convert to value, false: ignoring
    # convert_to: none # uint32 (use  only 4bytes), string (length <= 36), none: use raw bytes

# types:
#   messages:
#     - name: NewType # if camel case or lower case or snake case, will be converted to pascal case
#       description: '테스트 타입'
#       fields: []
# - name: NewNewType // recursive
#   fields:
#     - number: 1
#       name: colors
#       type: led.PixelData
#       property: repeated

services:
  # 1 to 6 reserved for windrpc core
  - id: 7
    name: led
    messages:
      - name: PixelData
        fields:
          - number: 1
            name: colors
            type: fixed32
            property: repeated
    rpcs:
      - id: 1
        name: display_pixels
        type: REQUEST_ONLY #if type is REQUEST_ONLY, response and notification definition will be ignored.
        command: PixelData
        result: null # ignored
        event: null # ignored
  - id: 8
    name: power
    messages:
      - name: PowerInfo
        fields:
          - { number: 1, name: voltage_mill, type: uint32 }
          - { number: 2, name: ampere_mill, type: uint32 }
          - { number: 3, name: watt_mill, type: uint32 }
    rpcs:
      - id: 1
        name: read_power_info
        type: REQUEST_RESPONSE
        command: types.Empty
        result: PowerInfo
      - id: 2
        name: power_info
        type: NOTIFICATION
        event: PowerInfo
